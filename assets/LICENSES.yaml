# 素材许可证清单（P14）
#
# 任何美术、音频、字体素材入库时，必须在本文件中追加一条记录。没有记录的素材，
# CI 拒绝合并。
#
# 每条记录包含以下字段：
#   file          素材路径，例如 assets/sprites/whale-idle.png
#   author        作者名或 handle
#   source        来源 URL，或「委托创作」
#   license       SPDX 标识符（CC0-1.0、CC-BY-4.0、CC-BY-SA-4.0、OFL-1.1 ...）
#   modifications 修改说明，例如「裁剪为 256x256，去除背景」
#   added         入库日期（YYYY-MM-DD）
#   notes         其他说明；自定义许可需附全文链接
#
# 规则：
# - 角色形象（鲸鱼娘）在取得原作者书面授权之前不得入库（Q10、§10.4）；
# - AI 生成的素材必须记录生成工具、提示词版本与人工挑选者；
# - license 必须是 SPDX 标识符；自定义许可需要在 notes 中附全文链接。
#
# 当前列表为空：assets/ 下除本文件外没有任何素材。

[]
