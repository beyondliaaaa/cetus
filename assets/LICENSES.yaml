# 素材许可证清单（P14）

任何美术、音频、字体素材入库时，必须在本文件中追加一条记录。没有记录的素材，
CI 拒绝合并。

字段：

```yaml
- file: assets/sprites/whale-idle.png
  author: "<作者名或 handle>"
  source: "<来源 URL 或「委托创作」>"
  license: "CC0-1.0"          # 必须是 SPDX 标识符
  modifications: "裁剪为 256x256，去除背景"
  added: "2026-10-23"
  notes: ""
```

规则：

- 角色形象（鲸鱼娘）在取得原作者**书面授权**之前不得入库（Q10、§10.4）；
- AI 生成的素材必须记录生成工具、提示词版本与人工挑选者；
- `license` 必须是 SPDX 标识符；自定义许可需要在 `notes` 中附全文链接。

当前列表为空。
